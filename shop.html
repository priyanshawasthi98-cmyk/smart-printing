<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Printing - Shop Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #174ea6;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      background: #174ea6;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .logout {
      background: #d93025;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      background: #fff;
      overflow-wrap: anywhere;
    }

    .order h3 {
      color: #174ea6;
      margin-top: 0;
    }

    .message {
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Smart Printing</h1>
  <h2 style="text-align:center;">Shop Dashboard</h2>

  <div class="box" id="loginBox">
    <h3>Shop Login</h3>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" type="button">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>

  <div id="dashboard" style="display:none;">

    <div class="box">
      <h3>Orders Dashboard</h3>

      <button id="refreshBtn" type="button">Refresh Orders</button>
      <button id="logoutBtn" class="logout" type="button">Logout</button>

      <div id="message" class="message"></div>
      <div id="orders">Loading orders...</div>
    </div>

  </div>

</div>

<script type="module">

  import { auth, db } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc,
    serverTimestamp,
    deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // NEW ADMIN UID
  const ADMIN_UID = "ibK3XWMUEYQIbBhPmGQRnW72MZg1";


  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const refreshBtn = document.getElementById("refreshBtn");

  const loginMessage = document.getElementById("loginMessage");
  const message = document.getElementById("message");
  const ordersDiv = document.getElementById("orders");


  function showMessage(element, text, type = "") {
    element.textContent = text;
    element.className = "message " + type;
  }


  // LOGIN
  loginBtn.addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage(loginMessage, "Enter email and password.", "error");
      return;
    }

    loginBtn.disabled = true;
    showMessage(loginMessage, "Logging in...");

    try {

      const result = await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      if (result.user.uid !== ADMIN_UID) {
        await signOut(auth);

        showMessage(
          loginMessage,
          "Access denied. This account is not an admin.",
          "error"
        );

        return;
      }

      showMessage(loginMessage, "Login successful.", "success");

    } catch (error) {

      showMessage(
        loginMessage,
        error.message,
        "error"
      );

    } finally {
      loginBtn.disabled = false;
    }

  });


  // AUTH CHECK
  onAuthStateChanged(auth, async (user) => {

    if (user && user.uid === ADMIN_UID) {

      loginBox.style.display = "none";
      dashboard.style.display = "block";

      await loadOrders();

    } else {

      loginBox.style.display = "block";
      dashboard.style.display = "none";

    }

  });


  // LOAD ORDERS
  async function loadOrders() {

    ordersDiv.textContent = "Loading orders...";
    showMessage(message, "");

    try {

      const ordersQuery = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(ordersQuery);

      if (snapshot.empty) {
        ordersDiv.textContent = "No orders found.";
        return;
      }

      ordersDiv.innerHTML = "";

      snapshot.forEach((orderDoc) => {

        const order = orderDoc.data();

        const orderId = order.orderId || orderDoc.id;

        const card = document.createElement("div");
        card.className = "order";

        const heading = document.createElement("h3");
        heading.textContent = "Order ID: " + orderId;
        card.appendChild(heading);

        function addDetail(label, value) {
          const p = document.createElement("p");
          p.textContent = label + ": " +
            (value === undefined || value === null ? "-" : value);
          card.appendChild(p);
        }

        addDetail("Customer", order.name);
        addDetail("Phone", order.phone);
        addDetail("Files", Array.isArray(order.fileNames)
          ? order.fileNames.join(", ")
          : "-");
        addDetail("Total Pages", order.totalPages);
        addDetail("Print Type", order.printType);
        addDetail("Print Side", order.printSide);
        addDetail("Copies", order.copies);
        addDetail("Total Amount", "₹" + order.totalPrice);
        addDetail("UTR", order.utr);
        addDetail("Payment Status", order.paymentStatus);
        addDetail("Order Status", order.orderStatus || "PENDING");

        const label = document.createElement("label");
        label.textContent = "Update Order Status";
        card.appendChild(label);

        const select = document.createElement("select");

        const statuses = [
          "PENDING",
          "ACCEPTED",
          "PRINTING",
          "COMPLETED",
          "REJECTED"
        ];

        const currentStatus = order.orderStatus || "PENDING";

        statuses.forEach((status) => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;

          if (status === currentStatus) {
            option.selected = true;
          }

          select.appendChild(option);
        });

        card.appendChild(select);

        const updateButton = document.createElement("button");
        updateButton.textContent = "Update Status";

        updateButton.addEventListener("click", async () => {

          const newStatus = select.value;

          if (
            newStatus === "COMPLETED" &&
            order.paymentStatus !== "PAID"
          ) {
            alert("Payment must be verified before completing this order.");
            return;
          }

          updateButton.disabled = true;
          updateButton.textContent = "Updating...";

          try {

            const updateData = {
              orderStatus: newStatus
            };

            if (newStatus === "COMPLETED") {
              updateData.completedAt = serverTimestamp();
            } else {
              updateData.completedAt = deleteField();
            }

            await updateDoc(
              doc(db, "orders", orderDoc.id),
              updateData
            );

            showMessage(
              message,
              "Order status updated successfully.",
              "success"
            );

            await loadOrders();

          } catch (error) {

            alert("Update failed: " + error.message);

            updateButton.disabled = false;
            updateButton.textContent = "Update Status";

          }

        });

        card.appendChild(updateButton);

        ordersDiv.appendChild(card);

      });

    } catch (error) {

      ordersDiv.textContent = "Error loading orders: " + error.message;

    }

  }


  // REFRESH
  refreshBtn.addEventListener("click", loadOrders);


  // LOGOUT
  logoutBtn.addEventListener("click", async () => {

    try {
      await signOut(auth);
    } catch (error) {
      alert("Logout failed: " + error.message);
    }

  });

</script>

</body>
</html>
