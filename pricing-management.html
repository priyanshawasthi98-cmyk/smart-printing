<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pricing Management | Smart Printing</title>

*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,sans-serif}
.hero{padding:26px 18px 38px;background:linear-gradient(120deg,#10234b,#2563eb);color:white}
.hero>div,main{max-width:1000px;margin:auto}
.hero small{letter-spacing:2px;opacity:.8}
.hero h1{margin:12px 0 6px;font-size:30px}
.hero p{margin:0;color:#dbeafe}
main{padding:0 16px 35px;margin-top:-18px}
.box{background:white;border:1px solid #e6eaf0;border-radius:17px;padding:20px;margin-bottom:17px;box-shadow:0 10px 28px #17203310}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2{font-size:19px;margin:0 0 7px}
.sub{color:#667085;font-size:13px;line-height:1.5;margin:0 0 17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{padding:14px;border:1px solid #e6eaf0;border-radius:13px;background:#fbfcfe}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:9px}
.input{display:flex;align-items:center;border:1px solid #d0d5dd;border-radius:10px;background:white;overflow:hidden}
.input span{padding:12px;border-right:1px solid #e6eaf0;color:#667085}
input{width:100%;min-width:0;border:0;outline:0;padding:12px;font-size:18px;font-weight:bold}
.hint{font-size:12px;color:#667085;margin-top:6px}
.prices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.price{background:#f8fafc;border:1px solid #e6eaf0;border-radius:12px;padding:13px}
.price span{display:block;color:#667085;font-size:12px;margin-bottom:8px}
.price b{font-size:22px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#eef2ff;color:#263b80}
.plain{background:#f2f4f7;color:#344054}
button:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:12px;padding:8px 12px;border-radius:30px;background:#f2f4f7;color:#475467}
.ok{background:#ecfdf3;color:#067647}
.bad{background:#fef3f2;color:#b42318}
.notice{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.5;margin-top:13px}
.success{background:#ecfdf3;color:#067647}
.warning{background:#fffaeb;color:#93370d}
