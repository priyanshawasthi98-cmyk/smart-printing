<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - Smart Printing</title>  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }

    header {
      background: #155eef;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 15px;
    }

    main {
      max-width: 500px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000010;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .label {
      color: #667085;
    }

    .value {
      font-weight: bold;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .total {
      font-size: 22px;
      color: #155eef;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm {
      background: #155eef;
      color: white;
    }

    .edit {
      background: #e8efff;
      color: #155eef;
    }

    .note {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }
  </style></head><body><header>
  <h1>🖨️ Smart Printing</h1>
  <p>Order ki details check karein</p>
</header><main>
  <div class="card">
    <h2>🧾 Order Summary</h2><div id="orderDetails">
  Order details load ho rahi hain...
</div>

<button class="edit" id="editButton" type="button">
  ✏️ Edit Order
</button>

<button class="confirm" id="confirmButton" type="button">
  ✅ Confirm Order
</button>

<p class="note">
  Note: Abhi yeh demo website hai. Order kisi real shop ko nahi bheja gaya hai.
  Payment bhi abhi process nahi hota.
</p>

  </div>
</main><script>
  const order = JSON.parse(
    sessionStorage.getItem("smartPrintingOrder") || "null"
  );

  const details = document.getElementById("orderDetails");

  if (!order) {
    details.textContent =
      "Order details nahi mili. Kripya pehle order form bharein.";

    document.getElementById("confirmButton").disabled = true;
  } else {
    const rows = [
      ["Order ID", order.orderId],
      ["Name", order.name],
      ["Files", order.fileNames.join(", ")],
      ["Total Pages", order.totalPages],
      ["Print Type", order.printType],
      ["Printing Side", order.printSide],
      ["Copies", order.copies],
      ["Total Price", "₹" + order.totalPrice]
    ];

    rows.forEach(function(item, index) {
      const row = document.createElement("div");
      row.className = "row";

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item[0];

      const value = document.createElement("span");
      value.className = index === 7 ? "value total" : "value";
      value.textContent = item[1];

      row.append(label, value);
      details.appendChild(row);
    });
  }

  document.getElementById("editButton").addEventListener("click", function() {
    window.location.href = "index.html";
  });

  document.getElementById("confirmButton").addEventListener("click", function() {
    if (!order) return;

    window.location.href = "payment.html";
  });
</script></body>
  </html>
