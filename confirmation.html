<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#155eef">
  <title>Order Confirmation - Smart Printing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #f2f5fa; color: #172033; }
    header { background: #155eef; color: white; text-align: center; padding: 25px 15px; border-radius: 15px; }
    main { max-width: 500px; margin: 25px auto; }
    .card { background: white; padding: 22px; border-radius: 15px; box-shadow: 0 3px 12px #00000010; }
    .row { display: flex; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid #eee; }
    .label { color: #667085; }
    .value { font-weight: bold; text-align: right; overflow-wrap: anywhere; }
    .total { font-size: 22px; color: #155eef; }
    button { width: 100%; padding: 14px; margin-top: 15px; border: 0; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .confirm { background: #155eef; color: white; }
    .edit { background: #e8efff; color: #155eef; }
    .note { color: #667085; font-size: 13px; line-height: 1.5; }
    .error { color: #b42318; line-height: 1.5; }
  </style>
</head>
<body>
<header>
  <h1>🖨️ Smart Printing</h1>
  <p>Order ki details check karein</p>
</header>
<main>
  <div class="card">
    <h2>🧾 Order Summary</h2>
    <div id="orderDetails" aria-live="polite">Order details load ho rahi hain...</div>
    <button class="edit" id="editButton" type="button">✏️ Edit Order</button>
    <button class="confirm" id="confirmButton" type="button" disabled>✅ Confirm Order</button>
    <p class="note">Note: Confirm karne par payment page khulega. UTR bharna payment ka proof nahi hai; shop ko print shuru karne se pehle payment verify karna hoga.</p>
  </div>
</main>
<script>
(() => {
  "use strict";

  const details = document.getElementById("orderDetails");
  const confirmButton = document.getElementById("confirmButton");

  function readJSON(key, fallback) {
    try {
      const value = sessionStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch {
      return fallback;
    }
  }

  // Current index.html stores each value under its own sessionStorage key.
  // The older demo stored one combined object under smartPrintingOrder.
  const legacy = readJSON("smartPrintingOrder", null);
  const order = legacy || {
    orderId: sessionStorage.getItem("orderId"),
    name: sessionStorage.getItem("name"),
    phone: sessionStorage.getItem("phone"),
    fileNames: readJSON("fileNames", []),
    filePaths: readJSON("filePaths", []),
    totalPages: sessionStorage.getItem("totalPages"),
    printType: sessionStorage.getItem("printType"),
    printSide: sessionStorage.getItem("printSide"),
    copies: sessionStorage.getItem("copies"),
    totalPrice: sessionStorage.getItem("totalPrice")
  };

  const valid = order &&
    order.orderId &&
    order.name &&
    Array.isArray(order.fileNames) &&
    order.fileNames.length > 0 &&
    order.totalPages &&
    order.printType &&
    order.printSide &&
    order.copies &&
    order.totalPrice !== null &&
    order.totalPrice !== undefined &&
    order.totalPrice !== "";

  if (!valid) {
    details.textContent = "Order details nahi mili. Kripya pehle order form dobara bharein.";
    details.className = "error";
  } else {
    const rows = [
      ["Order ID", order.orderId],
      ["Name", order.name],
      ["Files", order.fileNames.join(", ")],
      ["Total Pages", order.totalPages],
      ["Print Type", order.printType],
      ["Printing Side", order.printSide],
      ["Copies", order.copies],
      ["Total Price", "₹" + order.totalPrice]
    ];

    rows.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item[0];
      const value = document.createElement("span");
      value.className = index === 7 ? "value total" : "value";
      value.textContent = String(item[1]);
      row.append(label, value);
      details.appendChild(row);
    });
    confirmButton.disabled = false;
  }

  document.getElementById("editButton").addEventListener("click", () => {
    window.location.href = "index.html";
  });

  confirmButton.addEventListener("click", () => {
    if (!valid) return;
    window.location.href = "payment.html";
  });
})();
</script>
</body>
</html>
