<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Printing</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }header {
  background: #155eef;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0 0 10px;
}

main {
  max-width: 500px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #00000010;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  border-radius: 8px;
  font-size: 16px;
}

input, select {
  border: 1px solid #ccc;
  background: white;
}

button {
  margin-top: 22px;
  border: none;
  background: #155eef;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 18px;
  overflow-wrap: anywhere;
}

.note {
  font-size: 13px;
  color: #667085;
  line-height: 1.5;
}

  </style>
</head><body><header>
  <h1>🖨️ Smart Printing</h1>
  <p>Upload karo, print shop se collect karo!</p>
</header><main>
  <div class="card">
    <h2>Apna Print Order Banayein</h2><form id="printForm">
  <label for="file">PDF ya Photo select karein</label>
  <input
    type="file"
    id="file"
    accept=".pdf,.jpg,.jpeg,.png"
    multiple
    required
  >
<p id="pageCount">Total Pages: 0</p>
<p id="totalPrice">Total Price: ₹0</p>
  <label for="type">Print Type</label>
  <select id="type">
    <option>Black & White</option>
    <option>Colour</option>
  </select>

  <label for="side">Printing Side</label>
  <select id="side">
    <option>Single Side</option>
    <option>Double Side</option>
  </select>

<label for="copies">Copies</label>
<input
  type="number"
  id="copies"
  min="1"
  max="1000"
  step="1"
  value="1"
  placeholder="Copies ki sankhya likhein"
  required
>
  <label for="name">Aapka Naam</label>
  <input
    type="text"
    id="name"
    placeholder="Apna naam likhein"
    required
  >

  <label for="phone">Mobile Number</label>
  <input
    type="tel"
    id="phone"
    inputmode="numeric"
    pattern="[0-9]{10}"
    maxlength="10"
    placeholder="10 digit mobile number"
    required
  >

<button type="submit">Continue to Order Confirmation</button>
    </form>

<div id="result" aria-live="polite"></div>

<p class="note">
  Note: Yeh abhi demo website hai. Order filhaal kisi real shop ko nahi bheja jata.
</p>

</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
  import { db } from "./firebase.js";
import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("file");
const copiesInput = document.getElementById("copies");
const typeInput = document.getElementById("type");
const sideInput = document.getElementById("side");
const pageCountDisplay = document.getElementById("pageCount");
const totalPriceDisplay = document.getElementById("totalPrice");

let totalPages = 0;

async function countPages() {
  const files = Array.from(fileInput.files);
  totalPages = 0;

  if (files.length === 0) {
    pageCountDisplay.textContent = "Total Pages: 0";
    calculatePrice();
    return;
  }

  pageCountDisplay.textContent = "Pages count ho rahe hain...";

  try {
    let count = 0;

    for (const file of files) {
      if (file.name.toLowerCase().endsWith(".pdf")) {
        const data = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({
          data: data
        }).promise;

        count += pdf.numPages;
      } else {
        count += 1;
      }
    }

    totalPages = count;

    pageCountDisplay.textContent =
      "Total Pages (1 copy): " + totalPages;

    calculatePrice();

  } catch (error) {
    pageCountDisplay.textContent =
      "PDF pages count nahi ho paye. Dobara try karein.";

    totalPriceDisplay.textContent = "Total Price: Calculate nahi hua";
  }
}

function calculatePrice() {
  const copies = Number(copiesInput.value);

  if (
    totalPages === 0 ||
    !Number.isInteger(copies) ||
    copies < 1 ||
    copies > 1000
  ) {
    totalPriceDisplay.textContent = "Total Price: ₹0";
    return;
  }

  const printType = typeInput.value;
  const printSide = sideInput.value;

  let rate;
  let quantity;
  let unit;

  if (printType === "Black & White") {
    rate = printSide === "Single Side" ? 2 : 3;
  } else {
    rate = printSide === "Single Side" ? 10 : 15;
  }

  if (printSide === "Single Side") {
    quantity = totalPages * copies;
    unit = "pages";
  } else {
    quantity = Math.ceil(totalPages / 2) * copies;
    unit = "sheets";
  }

  const total = quantity * rate;

  totalPriceDisplay.textContent =
    "Total Price: ₹" + total +
    " (" + quantity + " " + unit +
    " × ₹" + rate + ")";
}

fileInput.addEventListener("change", countPages);
copiesInput.addEventListener("input", calculatePrice);
typeInput.addEventListener("change", calculatePrice);
sideInput.addEventListener("change", calculatePrice);
  document.getElementById("printForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const fileInput = document.getElementById("file");
    const files = Array.from(fileInput.files);
    const phone = document.getElementById("phone").value.trim();

    if (files.length === 0) {
      alert("Pehle PDF ya photo select karein.");
      return;
    }

    const allowedExtensions = /\.(pdf|jpg|jpeg|png)$/i;

    for (const file of files) {
      if (!allowedExtensions.test(file.name)) {
        alert("Sirf PDF, JPG, JPEG aur PNG files allowed hain.");
        return;
      }

      if (file.size > 15 * 1024 * 1024) {
        alert("Har file 15 MB se chhoti honi chahiye.");
        return;
      }
    }

    if (!/^[0-9]{10}$/.test(phone)) {
      alert("Sahi 10 digit mobile number likhein.");
      return;
    }

    const orderId = "SP-" + Date.now().toString().slice(-8);

const copies = Number(document.getElementById("copies").value);
const printType = typeInput.value;
const printSide = sideInput.value;

let rate;

if (printType === "Black & White") {
  rate = printSide === "Single Side" ? 2 : 3;
} else {
  rate = printSide === "Single Side" ? 10 : 15;
}

let quantity;

if (printSide === "Single Side") {
  quantity = totalPages * copies;
} else {
  quantity = Math.ceil(totalPages / 2) * copies;
}

const order = {
  orderId: orderId,
  name: document.getElementById("name").value.trim(),
  phone: phone,
  fileNames: files.map(file => file.name),
  totalPages: totalPages * copies,
  printType: printType,
  printSide: printSide,
  copies: copies,
  totalPrice: quantity * rate
};

sessionStorage.setItem(
  "smartPrintingOrder",
  JSON.stringify(order)
);

window.location.href = "confirmation.html";
    });
</script>
</body>
</html>
