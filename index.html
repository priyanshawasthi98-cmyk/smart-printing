<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#155eef">
  <title>Smart Printing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }

    /* Header */
    header {
      background: #155eef;
      color: white;
      text-align: center;
      padding: 28px 15px;
      animation: headerFade 0.7s ease both;
    }

    header h1 {
      animation: logoFloat 2.5s ease-in-out infinite;
    }

    header p {
      animation: fadeIn 1s ease both;
    }

    main {
      max-width: 540px;
      margin: 24px auto;
      padding: 0 14px;
    }

    /* Main Card */
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000010;
      animation: cardEnter 0.8s ease both;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px #00000012;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #ccc;
      background: white;
      transition: border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #155eef;
      box-shadow: 0 0 0 3px #155eef18;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #155eef;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease,
                  background 0.2s ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px #155eef30;
    }

    button:not(:disabled):active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    #result {
      margin-top: 14px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .note {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .summary {
      background: #f8fafc;
      border: 1px solid #e4e7ec;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
      transition: background 0.3s ease,
                  border-color 0.3s ease;
    }

    .error {
      color: #b42318;
    }

    .ok {
      color: #067647;
    }

    /* Animations */
    @keyframes headerFade {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🖨️ Smart Printing</h1>
  <p>Upload karo, print shop se collect karo!</p>
</header>

<main>
  <div class="card">

    <h2>Apna Print Order Banayein</h2>

    <form id="printForm">

      <label for="file">PDF ya Photo select karein</label>

      <input
        type="file"
        id="file"
        accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
        multiple
        required
      >

      <div class="summary" aria-live="polite">
        <p id="fileStatus">Abhi koi file select nahi hui.</p>
        <p id="pageCount"><strong>Total Pages:</strong> 0</p>
        <p id="totalPrice"><strong>Total Price:</strong> ₹0</p>
      </div>

      <label for="type">Print Type</label>

      <select id="type">
        <option value="Black &amp; White">Black &amp; White</option>
        <option value="Colour">Colour</option>
      </select>

      <label for="side">Printing Side</label>

      <select id="side">
        <option value="Single Side">Single Side</option>
        <option value="Double Side">Double Side</option>
      </select>

      <label for="copies">Copies</label>

      <input
        type="number"
        id="copies"
        min="1"
        max="1000"
        step="1"
        value="1"
        required
      >

      <label for="name">Aapka Naam</label>

      <input
        type="text"
        id="name"
        maxlength="60"
        placeholder="Apna naam likhein"
        required
      >

      <label for="phone">Mobile Number</label>

      <input
        type="tel"
        id="phone"
        inputmode="numeric"
        pattern="[0-9]{10}"
        maxlength="10"
        placeholder="10 digit mobile number"
        required
      >

      <button type="submit" id="submitBtn" disabled>
        Continue to Order Confirmation
      </button>

    </form>

    <div id="result" aria-live="polite"></div>

    <p class="note">
      Order submit hone ke baad details Firestore mein save hongi.
      Payment verify hone ke baad hi shop printing shuru karegi.
    </p>

  </div>
</main>

<script type="module">

import { db, auth, supabase } from "./firebase.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

"use strict";

const PDFJS_VERSION = "3.11.174";

const PDFJS_CDNS = [
  `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`,
  `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.min.js`
];

const PDF_WORKER =
  `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;


const fileInput = document.getElementById("file");
const copiesInput = document.getElementById("copies");
const typeInput = document.getElementById("type");
const sideInput = document.getElementById("side");

const pageDisplay = document.getElementById("pageCount");
const priceDisplay = document.getElementById("totalPrice");
const fileStatus = document.getElementById("fileStatus");

const submitBtn = document.getElementById("submitBtn");
const result = document.getElementById("result");
const form = document.getElementById("printForm");

let totalPages = 0;
let counting = false;
let uploading = false;
let selectionToken = 0;


function showMessage(message, className = "") {
  result.className = className;
  result.textContent = message;
}


function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src = src;
    script.async = true;
    script.onload = resolve;

    script.onerror = () => {
      script.remove();
      reject(new Error("PDF.js library load nahi hui."));
    };

    document.head.appendChild(script);
  });
}


async function ensurePdfJs() {

  if (window.pdfjsLib) {
    return window.pdfjsLib;
  }

  let lastError;

  for (const src of PDFJS_CDNS) {
    try {
      await loadScript(src);

      if (window.pdfjsLib) {
        return window.pdfjsLib;
      }

    } catch (error) {
      lastError = error;
    }
  }

  throw lastError ||
    new Error("PDF.js load nahi ho paayi.");
}


function calculatePrice() {

  const copies = Number(copiesInput.value);

  if (
    totalPages <= 0 ||
    !Number.isInteger(copies) ||
    copies < 1 ||
    copies > 1000
  ) {
    priceDisplay.innerHTML =
      "<strong>Total Price:</strong> ₹0";

    return 0;
  }

  let rate;

  if (typeInput.value === "Black & White") {
    rate = sideInput.value === "Single Side" ? 2 : 3;
  } else {
    rate = sideInput.value === "Single Side" ? 10 : 15;
  }

  const billableUnits =
    sideInput.value === "Single Side"
      ? totalPages * copies
      : Math.ceil(totalPages / 2) * copies;

  const total = billableUnits * rate;

  priceDisplay.innerHTML =
    `<strong>Total Price:</strong> ₹${total}`;

  return total;
}


async function countPages() {

  const token = ++selectionToken;
  const files = Array.from(fileInput.files || []);

  totalPages = 0;
  calculatePrice();
  showMessage("");

  if (files.length === 0) {

    pageDisplay.innerHTML =
      "<strong>Total Pages:</strong> 0";

    fileStatus.textContent =
      "Abhi koi file select nahi hui.";

    submitBtn.disabled = true;
    counting = false;

    return;
  }

  counting = true;
  submitBtn.disabled = true;

  pageDisplay.textContent =
    "Pages count ho rahe hain...";

  priceDisplay.innerHTML =
    "<strong>Total Price:</strong> Calculating...";

  fileStatus.textContent =
    `${files.length} file(s) selected.`;

  try {

    let count = 0;
    let pdfLib = null;

    for (const file of files) {

      if (token !== selectionToken) return;

      if (file.size <= 0) {
        throw new Error(`${file.name}: file khaali hai.`);
      }

      if (file.size > 15 * 1024 * 1024) {
        throw new Error(`${file.name}: file 15 MB se badi hai.`);
      }

      const extension =
        file.name.split(".").pop().toLowerCase();

      if (
        extension === "pdf" ||
        file.type === "application/pdf"
      ) {

        if (!pdfLib) {

          pdfLib = await ensurePdfJs();

          pdfLib.GlobalWorkerOptions.workerSrc =
            PDF_WORKER;
        }

        const data =
          new Uint8Array(await file.arrayBuffer());

        const loadingTask =
          pdfLib.getDocument({ data });

        const pdf = await loadingTask.promise;

        count += pdf.numPages;

        await pdf.destroy();

      } else if (
        ["jpg", "jpeg", "png"].includes(extension) ||
        ["image/jpeg", "image/png"].includes(file.type)
      ) {

        count += 1;

      } else {

        throw new Error(
          `${file.name}: sirf PDF, JPG, JPEG aur PNG allowed hain.`
        );
      }
    }

    if (token !== selectionToken) return;

    if (count < 1) {
      throw new Error("Pages count nahi ho paaye.");
    }

    totalPages = count;

    pageDisplay.innerHTML =
      `<strong>Total Pages (1 copy):</strong> ${totalPages}`;

    calculatePrice();

    fileStatus.textContent =
      `${files.length} file(s) successfully read.`;

    showMessage("Page counting successful.", "ok");

  } catch (error) {

    if (token !== selectionToken) return;

    console.error(error);

    totalPages = 0;

    pageDisplay.innerHTML =
      "<strong>Total Pages:</strong> 0";

    priceDisplay.innerHTML =
      "<strong>Total Price:</strong> ₹0";

    fileStatus.textContent =
      "File read nahi ho paayi.";

    showMessage(error.message, "error");

  } finally {

    if (token === selectionToken) {
      counting = false;
      submitBtn.disabled = totalPages <= 0 || uploading;
    }
  }
}


fileInput.addEventListener("change", countPages);
copiesInput.addEventListener("input", calculatePrice);
typeInput.addEventListener("change", calculatePrice);
sideInput.addEventListener("change", calculatePrice);


form.addEventListener("submit", async (event) => {

  event.preventDefault();

  if (uploading) return;

  const files = Array.from(fileInput.files || []);

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const copies = Number(copiesInput.value);
  const totalPrice = calculatePrice();


  if (counting) {
    showMessage("Page counting complete hone ka wait karein.", "error");
    return;
  }

  if (!files.length || totalPages <= 0) {
    showMessage("Pehle valid PDF ya photo select karein.", "error");
    return;
  }

  if (
    !Number.isInteger(copies) ||
    copies < 1 ||
    copies > 1000
  ) {
    showMessage("Copies 1 se 1000 ke beech honi chahiye.", "error");
    return;
  }

  if (!name) {
    showMessage("Apna naam likhein.", "error");
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    showMessage("Sahi 10 digit mobile number likhein.", "error");
    return;
  }

  if (!Number.isFinite(totalPrice) || totalPrice <= 0) {
    showMessage("Price calculate nahi ho paayi.", "error");
    return;
  }


  uploading = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "Order process ho raha hai...";

  let uploadedPaths = [];

  try {

    // STEP 1: ANONYMOUS LOGIN

    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }

    const customerUid = auth.currentUser.uid;


    // STEP 2: CREATE ORDER ID

    const orderId = "SP-" + Date.now();


    // STEP 3: UPLOAD FILES

    const filePaths = [];
    const fileNames = [];

    for (const file of files) {

      const safeName =
        file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      const path =
        `${orderId}/${Date.now()}_${safeName}`;

      const { error } = await supabase.storage
        .from("print-files")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type || "application/octet-stream"
        });

      if (error) throw error;

      filePaths.push(path);
      fileNames.push(file.name);
      uploadedPaths.push(path);
    }


    // STEP 4: SAVE ORDER IN FIRESTORE

    const orderData = {

      orderId: orderId,
      uid: customerUid,

      name: name,
      phone: phone,

      fileNames: fileNames,
      filePaths: filePaths,

      totalPages: totalPages * copies,

      printType: typeInput.value,
      printSide: sideInput.value,

      copies: copies,
      totalPrice: totalPrice,

      utr: "",

      paymentStatus: "PENDING",
      orderStatus: "PENDING",

      createdAt: serverTimestamp()

    };


    await setDoc(
      doc(db, "orders", orderId),
      orderData
    );


    // STEP 5: SAVE SESSION DATA

    sessionStorage.setItem("orderId", orderId);
    sessionStorage.setItem("customerUid", customerUid);

    sessionStorage.setItem("name", name);
    sessionStorage.setItem("phone", phone);

    sessionStorage.setItem(
      "fileNames",
      JSON.stringify(fileNames)
    );

    sessionStorage.setItem(
      "filePaths",
      JSON.stringify(filePaths)
    );

    sessionStorage.setItem(
      "totalPages",
      String(totalPages * copies)
    );

    sessionStorage.setItem("printType", typeInput.value);
    sessionStorage.setItem("printSide", sideInput.value);
    sessionStorage.setItem("copies", String(copies));
    sessionStorage.setItem("totalPrice", String(totalPrice));


    // STEP 6: REDIRECT

    showMessage("Order successfully saved!", "ok");

    window.location.href = "confirmation.html";


  } catch (error) {

    console.error("Order creation failed:", error);

    showMessage(
      "Order save nahi hua: " +
      (error.message || "Unknown error"),
      "error"
    );

    // Uploaded files may remain in storage if Firestore save fails.
    // Cleanup can be added after testing.

    uploading = false;

    submitBtn.disabled = totalPages <= 0;

    submitBtn.textContent =
      "Continue to Order Confirmation";
  }

});


pageDisplay.innerHTML =
  "<strong>Total Pages:</strong> 0";

priceDisplay.innerHTML =
  "<strong>Total Price:</strong> ₹0";

</script>

</body>
                            </html>
