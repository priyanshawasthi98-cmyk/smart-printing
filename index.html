<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Printing</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #172033;
}
header {
  background: #155eef;
  color: white;
  text-align: center;
  padding: 30px 15px;
}
header h1 { margin: 0 0 10px; }
main {
  max-width: 500px;
  margin: 25px auto;
  padding: 0 15px;
}
.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #00000010;
}
label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}
input, select, button {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  border-radius: 8px;
  font-size: 16px;
}
input, select {
  border: 1px solid #ccc;
  background: white;
}
button {
  margin-top: 22px;
  border: none;
  background: #155eef;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  background: #98a2b3;
  cursor: not-allowed;
}
#result {
  margin-top: 18px;
  overflow-wrap: anywhere;
}
.note {
  font-size: 13px;
  color: #667085;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>
<h1>🖨️ Smart Printing</h1>
<p>Upload karo, print shop se collect karo!</p>
</header>

<main>
<div class="card">

<h2>Apna Print Order Banayein</h2>

<form id="printForm">

<label for="file">PDF ya Photo select karein</label>
<input
  type="file"
  id="file"
  accept=".pdf,.jpg,.jpeg,.png"
  multiple
  required
>

<p id="pageCount">Total Pages: 0</p>
<p id="totalPrice">Total Price: ₹0</p>

<label for="type">Print Type</label>
<select id="type">
  <option>Black & White</option>
  <option>Colour</option>
</select>

<label for="side">Printing Side</label>
<select id="side">
  <option>Single Side</option>
  <option>Double Side</option>
</select>

<label for="copies">Copies</label>
<input
  type="number"
  id="copies"
  min="1"
  max="1000"
  step="1"
  value="1"
  required
>

<label for="name">Aapka Naam</label>
<input
  type="text"
  id="name"
  placeholder="Apna naam likhein"
  required
>

<label for="phone">Mobile Number</label>
<input
  type="tel"
  id="phone"
  inputmode="numeric"
  pattern="[0-9]{10}"
  maxlength="10"
  placeholder="10 digit mobile number"
  required
>

<button type="submit" id="submitBtn">
Continue to Order Confirmation
</button>

</form>

<div id="result" aria-live="polite"></div>

<p class="note">
Note: Order confirmation ke baad payment process hoga.
</p>

</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script type="module">

import { supabase } from "./firebase.js";

const pdfjs = window.pdfjsLib;

const fileInput = document.getElementById("file");
const copiesInput = document.getElementById("copies");
const typeInput = document.getElementById("type");
const sideInput = document.getElementById("side");
const pageCountDisplay = document.getElementById("pageCount");
const totalPriceDisplay = document.getElementById("totalPrice");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

let totalPages = 0;
let counting = false;
let selectionNumber = 0;

if (!pdfjs) {
  pageCountDisplay.textContent = "PDF library load nahi hui.";
  submitBtn.disabled = true;
} else {
  pdfjs.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}


// PRICE CALCULATION

function calculatePrice() {

  const copies = Number(copiesInput.value);

  if (
    totalPages <= 0 ||
    !Number.isInteger(copies) ||
    copies < 1 ||
    copies > 1000
  ) {
    totalPriceDisplay.textContent = "Total Price: ₹0";
    return;
  }

  const printType = typeInput.value;
  const printSide = sideInput.value;

  let rate;

  if (printType === "Black & White") {
    rate = printSide === "Single Side" ? 2 : 3;
  } else {
    rate = printSide === "Single Side" ? 10 : 15;
  }

  let quantity;

  if (printSide === "Single Side") {
    quantity = totalPages * copies;
  } else {
    quantity = Math.ceil(totalPages / 2) * copies;
  }

  const total = quantity * rate;

  totalPriceDisplay.textContent = "Total Price: ₹" + total;
}


// PDF AND PHOTO PAGE COUNT

async function countPages() {

  const currentSelection = ++selectionNumber;
  const files = Array.from(fileInput.files);

  totalPages = 0;
  calculatePrice();

  if (files.length === 0) {
    pageCountDisplay.textContent = "Total Pages: 0";
    counting = false;
    submitBtn.disabled = false;
    return;
  }

  if (!pdfjs) {
    pageCountDisplay.textContent = "PDF library load nahi hui.";
    return;
  }

  counting = true;
  submitBtn.disabled = true;

  pageCountDisplay.textContent = "Pages count ho rahe hain...";
  totalPriceDisplay.textContent = "Total Price: Calculating...";

  try {

    let count = 0;

    for (const file of files) {

      const extension = file.name.split(".").pop().toLowerCase();

      if (extension === "pdf") {

        const data = await file.arrayBuffer();

        const pdf = await pdfjs.getDocument({
          data: new Uint8Array(data)
        }).promise;

        count += pdf.numPages;

        pdf.destroy();

      } else if (
        extension === "jpg" ||
        extension === "jpeg" ||
        extension === "png"
      ) {

        count += 1;

      } else {

        throw new Error("Unsupported file format: " + file.name);

      }
    }

    if (currentSelection !== selectionNumber) return;

    totalPages = count;

    pageCountDisplay.textContent =
      "Total Pages (1 copy): " + totalPages;

    calculatePrice();

  } catch (error) {

    if (currentSelection !== selectionNumber) return;

    console.error("Page counting error:", error);

    totalPages = 0;

    pageCountDisplay.textContent =
      "PDF Error: " + error.message;

    totalPriceDisplay.textContent =
      "Total Price: Calculate nahi hua";

  } finally {

    if (currentSelection === selectionNumber) {
      counting = false;
      submitBtn.disabled = false;
    }

  }
}


// INPUT EVENTS

fileInput.addEventListener("change", countPages);

copiesInput.addEventListener("input", calculatePrice);

typeInput.addEventListener("change", calculatePrice);

sideInput.addEventListener("change", calculatePrice);


// FORM SUBMISSION

document.getElementById("printForm").addEventListener(
"submit",
async function(event) {

  event.preventDefault();

  const files = Array.from(fileInput.files);
  const phone = document.getElementById("phone").value.trim();
  const name = document.getElementById("name").value.trim();
  const copies = Number(copiesInput.value);

  if (counting) {
    alert("Page counting complete hone ka wait karein.");
    return;
  }

  if (files.length === 0 || totalPages === 0) {
    alert("Pehle valid PDF ya photo select karein.");
    return;
  }

  if (!Number.isInteger(copies) || copies < 1 || copies > 1000) {
    alert("Copies 1 se 1000 ke beech honi chahiye.");
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Sahi 10 digit mobile number likhein.");
    return;
  }

  const allowedExtensions = /\.(pdf|jpg|jpeg|png)$/i;

  for (const file of files) {

    if (!allowedExtensions.test(file.name)) {
      alert("Sirf PDF, JPG, JPEG aur PNG allowed hain.");
      return;
    }

    if (file.size > 15 * 1024 * 1024) {
      alert("Har file 15 MB se chhoti honi chahiye.");
      return;
    }
  }

  const orderId =
    "SP-" + Date.now().toString().slice(-8);

  const printType = typeInput.value;
  const printSide = sideInput.value;

  let rate;

  if (printType === "Black & White") {
    rate = printSide === "Single Side" ? 2 : 3;
  } else {
    rate = printSide === "Single Side" ? 10 : 15;
  }

  let quantity;

  if (printSide === "Single Side") {
    quantity = totalPages * copies;
  } else {
    quantity = Math.ceil(totalPages / 2) * copies;
  }

  const totalPrice = quantity * rate;

  submitBtn.disabled = true;
  submitBtn.textContent = "Files upload ho rahi hain...";
  result.textContent = "Kripya wait karein...";

  try {

    const uploadedFiles = [];

    for (let i = 0; i < files.length; i++) {

      const file = files[i];

      const safeName = file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

      const filePath =
        orderId + "/" + Date.now() + "_" + i + "_" + safeName;

      const { data, error } = await supabase.storage
        .from("print-files")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type || "application/octet-stream"
        });

      if (error) {
        throw error;
      }

      uploadedFiles.push({
        name: file.name,
        path: data.path
      });
    }

    const order = {

      orderId: orderId,
      name: name,
      phone: phone,

      fileNames: uploadedFiles.map(file => file.name),
      filePaths: uploadedFiles.map(file => file.path),

      totalPages: totalPages * copies,
      printType: printType,
      printSide: printSide,
      copies: copies,
      totalPrice: totalPrice

    };

    sessionStorage.setItem(
      "smartPrintingOrder",
      JSON.stringify(order)
    );

    result.textContent = "Upload complete!";

    window.location.href = "confirmation.html";

  } catch (error) {

    console.error("Upload error:", error);

    result.textContent =
      "Upload failed: " + (error.message || "Please try again.");

    submitBtn.disabled = false;

    submitBtn.textContent =
      "Continue to Order Confirmation";

  }

});

</script>

</body>
  </html>
