<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7048e8">
  <title>Payment - Smart Printing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #f3eaff, #e8f4ff, #fff0f6);
      background-size: 300% 300%;
      animation: backgroundMove 12s ease infinite;
      overflow-x: hidden;
    }

    @keyframes backgroundMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: linear-gradient(120deg, #7048e8, #155eef, #e84393);
      background-size: 200% 200%;
      animation: gradientMove 6s ease infinite;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 8px 25px #7048e844;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header h1 {
      margin: 8px 0;
      font-size: 27px;
    }

    .stickers {
      font-size: 25px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .stickers span {
      display: inline-block;
      animation: float 2.5s ease-in-out infinite;
    }

    .stickers span:nth-child(2) { animation-delay: .5s; }
    .stickers span:nth-child(3) { animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-9px) rotate(8deg); }
    }

    main {
      max-width: 500px;
      margin: 25px auto;
      position: relative;
      z-index: 2;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000012;
      animation: cardAppear .7s ease both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .payment-icon {
      text-align: center;
      font-size: 48px;
      margin: 5px 0 15px;
      animation: float 2.5s ease-in-out infinite;
    }

    h2 {
      color: #7048e8;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      animation: rowAppear .5s ease both;
    }

    .row:nth-child(2) { animation-delay: .1s; }
    .row:nth-child(3) { animation-delay: .2s; }
    .row:nth-child(4) { animation-delay: .3s; }
    .row:nth-child(5) { animation-delay: .4s; }
    .row:nth-child(6) { animation-delay: .5s; }
    .row:nth-child(7) { animation-delay: .6s; }
    .row:nth-child(8) { animation-delay: .7s; }

    @keyframes rowAppear {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .label {
      color: #667085;
    }

    .value {
      font-weight: bold;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .total {
      color: #7048e8;
      font-size: 24px;
    }

    .price-box {
      background: linear-gradient(120deg, #f0eaff, #e7f2ff);
      border-radius: 12px;
      padding: 5px 12px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .25s;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .pay {
      background: linear-gradient(120deg, #7048e8, #155eef);
      color: white;
      box-shadow: 0 5px 15px #7048e844;
    }

    .pay:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px #7048e855;
    }

    .back {
      background: #f0eaff;
      color: #7048e8;
    }

    .note {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
      background: #fff8e7;
      padding: 12px;
      border-radius: 10px;
      margin-top: 18px;
    }

    #qrSection {
      text-align: center;
      margin-top: 20px;
      padding: 18px;
      background: linear-gradient(135deg, #f8faff, #f5edff);
      border: 1px solid #e5dcff;
      border-radius: 16px;
      animation: cardAppear .5s ease both;
    }

    #qrImage {
      width: 230px;
      max-width: 100%;
      display: block;
      margin: 15px auto;
      padding: 10px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px #7048e833;
      animation: qrAppear .6s ease both;
    }

    @keyframes qrAppear {
      from { opacity: 0; transform: scale(.8); }
      to { opacity: 1; transform: scale(1); }
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 8px;
      outline: none;
      transition: .2s;
    }

    input:focus {
      border-color: #7048e8;
      box-shadow: 0 0 0 3px #7048e822;
    }

    #paymentMessage {
      margin-top: 15px;
      padding: 12px;
      background: #fff4e5;
      border-radius: 8px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      animation: cardAppear .4s ease;
    }

    .floating {
      position: fixed;
      font-size: 23px;
      pointer-events: none;
      animation: float 4s ease-in-out infinite;
      opacity: .6;
      z-index: 0;
    }

    .f1 { top: 20%; left: 3%; }
    .f2 { top: 55%; right: 3%; animation-delay: 1s; }
    .f3 { bottom: 12%; left: 7%; animation-delay: 2s; }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <canvas id="confetti"></canvas>

  <div class="floating f1">🌟</div>
  <div class="floating f2">🎈</div>
  <div class="floating f3">✨</div>

  <header>
    <div class="stickers">
      <span>🎉</span>
      <span>🖨️</span>
      <span>💳</span>
    </div>

    <h1>Smart Printing</h1>
    <p>Secure UPI Payment</p>
  </header>

  <main>
    <div class="card">

      <div class="payment-icon">💳</div>

      <h2>Payment Summary</h2>

      <div id="orderDetails">
        Order details load ho rahi hain...
      </div>

      <button class="pay" id="payButton" type="button">
        Generate Payment QR
      </button>

      <section id="qrSection" hidden>

        <h3>📱 Scan &amp; Pay</h3>

        <p id="qrAmount"></p>

        <img id="qrImage" alt="UPI Payment QR Code">

        <p><b>UPI ID: 9770981980@ybl</b></p>

        <button class="pay" id="openUPI" type="button">
          📲 Open UPI App
        </button>

        <label for="utr">
          <b>Payment UTR / Transaction ID</b>
        </label>

        <input
          id="utr"
          type="text"
          maxlength="30"
          placeholder="Payment ke baad UTR dalein"
          autocomplete="off"
        >

        <button class="pay" id="submitUTR" type="button">
          Submit Payment Reference
        </button>

      </section>

      <button class="back" id="backButton" type="button">
        ← Back to Order
      </button>

      <div id="paymentMessage" hidden></div>

      <p class="note">
        ⚠️ UTR submit karne se payment automatically verify nahi hota.
        Payment verify hone ke baad hi Admin payment ko Paid mark karega.
      </p>

    </div>
  </main>

  <script type="module">

    import { db, auth } from "./firebase.js";

    import {
      doc,
      getDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const UPI_ID = "9770981980@ybl";
    const UPI_NAME = "Smart Printing";

    const get = key => sessionStorage.getItem(key);

    function readOrder() {
      let legacy = null;

      try {
        legacy = JSON.parse(get("smartPrintingOrder") || "null");
      } catch (error) {
        console.warn("Legacy order data invalid.", error);
      }

      const separate = {
        orderId: get("orderId"),
        name: get("name"),
        phone: get("phone"),
        fileNames: get("fileNames"),
        filePaths: get("filePaths"),
        totalPages: get("totalPages"),
        printType: get("printType"),
        printSide: get("printSide"),
        copies: get("copies"),
        totalPrice: get("totalPrice")
      };

      const raw = separate.orderId ? separate : (legacy || {});

      function arrayValue(value) {
        if (Array.isArray(value)) return value;

        if (typeof value !== "string" || !value) return [];

        try {
          const parsed = JSON.parse(value);
          if (Array.isArray(parsed)) return parsed;
        } catch (_) {}

        return value.split(",").map(x => x.trim()).filter(Boolean);
      }

      return {
        orderId: raw.orderId,
        name: raw.name,
        phone: raw.phone,
        fileNames: arrayValue(raw.fileNames),
        filePaths: arrayValue(raw.filePaths),
        totalPages: Number(raw.totalPages),
        printType: raw.printType,
        printSide: raw.printSide,
        copies: Number(raw.copies),
        totalPrice: Number(raw.totalPrice)
      };
    }

    const order = readOrder();

    const details = document.getElementById("orderDetails");
    const payButton = document.getElementById("payButton");
    const message = document.getElementById("paymentMessage");
    const qrSection = document.getElementById("qrSection");
    const submitButton = document.getElementById("submitUTR");

    let paymentSubmitted = false;

    function showMessage(text) {
      message.hidden = false;
      message.textContent = text;
    }

    const validOrder = Boolean(
      order.orderId &&
      order.name &&
      /^[0-9]{10}$/.test(String(order.phone || "")) &&
      order.fileNames.length > 0 &&
      order.filePaths.length === order.fileNames.length &&
      Number.isInteger(order.totalPages) &&
      order.totalPages > 0 &&
      Number.isInteger(order.copies) &&
      order.copies > 0 &&
      Number.isFinite(order.totalPrice) &&
      order.totalPrice > 0 &&
      ["Black & White", "Colour"].includes(order.printType) &&
      ["Single Side", "Double Side"].includes(order.printSide)
    );

    if (!validOrder) {

      details.textContent =
        "Valid order nahi mila ya order data adhura hai. Please order page se dobara order banayein.";

      payButton.disabled = true;

      showMessage(
        "Order details missing hain. Back to Order par tap karke dobara try karein."
      );

    } else {

      [
        ["Order ID", order.orderId],
        ["Name", order.name],
        ["Files", order.fileNames.join(", ")],
        ["Total Pages", order.totalPages],
        ["Print Type", order.printType],
        ["Printing Side", order.printSide],
        ["Copies", order.copies],
        ["Total Amount", "₹" + order.totalPrice.toFixed(2)]
      ].forEach((item, index) => {

        const row = document.createElement("div");
        row.className = "row";

        if (index === 7) {
          row.classList.add("price-box");
        }

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0];

        const value = document.createElement("span");
        value.className = index === 7 ? "value total" : "value";
        value.textContent = item[1];

        row.append(label, value);
        details.appendChild(row);

      });

    }

    function generateQR() {

      if (!validOrder) return;

      const amount = order.totalPrice.toFixed(2);

      const upiLink = "upi://pay?" + new URLSearchParams({
        pa: UPI_ID,
        pn: UPI_NAME,
        am: amount,
        cu: "INR",
        tn: "Order " + order.orderId
      }).toString();

      document.getElementById("qrImage").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
        encodeURIComponent(upiLink);

      document.getElementById("qrAmount").textContent =
        "Pay exactly ₹" + amount;

      document.getElementById("openUPI").onclick = () => {
        window.location.href = upiLink;
      };

      qrSection.hidden = false;
      payButton.disabled = true;
      payButton.textContent = "QR Generated";

      startConfetti();
    }

    payButton.addEventListener("click", generateQR);

    // Firebase Auth initialization ka wait
    function waitForAuth() {
      return new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
          unsubscribe();
          resolve(user);
        });
      });
    }

    // UTR ko existing Order mein update karna
    submitButton.addEventListener("click", async () => {

      if (!validOrder || paymentSubmitted) return;

      const utr = document.getElementById("utr").value.trim();

      if (!/^[A-Za-z0-9]{8,30}$/.test(utr)) {

        showMessage(
          "Kripya valid UTR enter karein (8–30 letters/numbers)."
        );

        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      try {

        const user = await waitForAuth();

        if (!user) {
          throw new Error(
            "Customer login nahi mila. Isi browser mein order dobara banayein."
          );
        }

        const customerUid = get("customerUid");

        if (!customerUid || user.uid !== customerUid) {
          throw new Error(
            "Customer session match nahi hui. Order dobara banayein."
          );
        }

        const orderRef = doc(db, "orders", order.orderId);

        const orderSnapshot = await getDoc(orderRef);

        if (!orderSnapshot.exists()) {
          throw new Error("Firestore mein Order nahi mila.");
        }

        const savedOrder = orderSnapshot.data();

        if (savedOrder.uid !== user.uid) {
          throw new Error("Is Order ko update karne ki permission nahi hai.");
        }

        if (savedOrder.utr && savedOrder.utr !== "") {
          throw new Error("Is Order ka UTR pehle hi submit ho chuka hai.");
        }

        if (
          savedOrder.paymentStatus !== "PENDING" ||
          savedOrder.orderStatus !== "PENDING"
        ) {
          throw new Error("Order ka current status update ke liye valid nahi hai.");
        }

        // Sirf existing Order ka UTR update hoga.
        await updateDoc(orderRef, {
          utr: utr
        });

        paymentSubmitted = true;

        showMessage(
          "UTR successfully save ho gaya! Payment status abhi bhi PENDING hai. Admin transaction verify karne ke baad hi Paid mark karega."
        );

        submitButton.textContent = "UTR Submitted";

      } catch (error) {

        console.error(error);

        showMessage(
          "UTR save nahi hua: " + (error.message || "Unknown error")
        );

        submitButton.disabled = false;
        submitButton.textContent = "Retry Submit";

      }

    });

    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = "confirmation.html";
    });

    // Confetti animation
    function startConfetti() {

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      if (!ctx) return;

      let pieces = [];
      let startTime = performance.now();
      let animationId;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;

        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      resize();
      window.addEventListener("resize", resize);

      const colors = [
        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#a55eea",
        "#ff6bcb",
        "#f9ca24"
      ];

      for (let i = 0; i < 90; i++) {

        pieces.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * -window.innerHeight,
          size: Math.random() * 7 + 4,
          speed: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          spin: Math.random() * 5 - 2.5,
          color: colors[Math.floor(Math.random() * colors.length)]
        });

      }

      function animate(now) {

        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        pieces.forEach(p => {

          p.y += p.speed;
          p.rotation += p.spin;
          p.x += Math.sin(p.y / 30) * 1.2;

          ctx.save();

          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);

          ctx.fillStyle = p.color;
          ctx.fillRect(
            -p.size / 2,
            -p.size / 2,
            p.size,
            p.size * .65
          );

          ctx.restore();

          if (p.y > window.innerHeight + 20) {
            p.y = -20;
            p.x = Math.random() * window.innerWidth;
          }

        });

        if (now - startTime < 4000) {

          animationId = requestAnimationFrame(animate);

        } else {

          cancelAnimationFrame(animationId);

          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

          window.removeEventListener("resize", resize);

        }

      }

      animationId = requestAnimationFrame(animate);
    }

  </script>

</body>
  </html>
