<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Smart Printing</title>

  <style>
    body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f5fa;color:#172033}
    header{background:#155eef;color:white;text-align:center;padding:25px 15px;border-radius:15px}
    main{max-width:500px;margin:25px auto}
    .card{background:white;padding:22px;border-radius:15px;box-shadow:0 3px 12px #00000010}
    .row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eee}
    .label{color:#667085}.value{font-weight:bold;text-align:right;overflow-wrap:anywhere}
    .total{color:#155eef;font-size:24px}
    button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .pay{background:#155eef;color:white}.back{background:#e8efff;color:#155eef}
    .note{color:#667085;font-size:13px;line-height:1.6}
    #qrSection{text-align:center;margin-top:20px;padding:15px;background:#f8faff;border-radius:12px}
    #qrImage{width:230px;max-width:100%;display:block;margin:15px auto}
    input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-top:8px}
    #paymentMessage{margin-top:15px;padding:12px;background:#fff4e5;border-radius:8px;line-height:1.6;overflow-wrap:anywhere}
  </style>
</head>

<body>
  <header>
    <h1>🖨️ Smart Printing</h1>
    <p>UPI Payment</p>
  </header>

  <main>
    <div class="card">
      <h2>💳 Payment Summary</h2>

      <div id="orderDetails">Order details load ho rahi hain...</div>

      <button class="pay" id="payButton" type="button">
        Generate Payment QR
      </button>

      <section id="qrSection" hidden>
        <h3>Scan &amp; Pay</h3>
        <p id="qrAmount"></p>

        <img id="qrImage" alt="UPI Payment QR Code">

        <p>UPI ID: 9770981980@ybl</p>

        <button class="pay" id="openUPI" type="button">
          Open UPI App
        </button>

        <label for="utr"><b>Payment UTR / Transaction ID</b></label>

        <input
          id="utr"
          type="text"
          maxlength="30"
          placeholder="Payment ke baad UTR dalein"
          autocomplete="off"
        >

        <button class="pay" id="submitUTR" type="button">
          Submit Payment Reference
        </button>
      </section>

      <button class="back" id="backButton" type="button">
        Back to Order
      </button>

      <div id="paymentMessage" hidden></div>

      <p class="note">
        UTR submit karne se payment automatically verify nahi hota.
        Payment verify hone ke baad hi Admin payment ko Paid mark karega.
      </p>
    </div>
  </main>

  <script type="module">
    import { db, auth } from "./firebase.js";

    import {
      doc,
      getDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const UPI_ID = "9770981980@ybl";
    const UPI_NAME = "Smart Printing";

    const get = key => sessionStorage.getItem(key);

    function readOrder() {
      let legacy = null;

      try {
        legacy = JSON.parse(get("smartPrintingOrder") || "null");
      } catch (error) {
        console.warn("Legacy order data invalid.", error);
      }

      const separate = {
        orderId: get("orderId"),
        name: get("name"),
        phone: get("phone"),
        fileNames: get("fileNames"),
        filePaths: get("filePaths"),
        totalPages: get("totalPages"),
        printType: get("printType"),
        printSide: get("printSide"),
        copies: get("copies"),
        totalPrice: get("totalPrice")
      };

      const raw = separate.orderId ? separate : (legacy || {});

      function arrayValue(value) {
        if (Array.isArray(value)) return value;

        if (typeof value !== "string" || !value) return [];

        try {
          const parsed = JSON.parse(value);
          if (Array.isArray(parsed)) return parsed;
        } catch (_) {}

        return value.split(",").map(x => x.trim()).filter(Boolean);
      }

      return {
        orderId: raw.orderId,
        name: raw.name,
        phone: raw.phone,
        fileNames: arrayValue(raw.fileNames),
        filePaths: arrayValue(raw.filePaths),
        totalPages: Number(raw.totalPages),
        printType: raw.printType,
        printSide: raw.printSide,
        copies: Number(raw.copies),
        totalPrice: Number(raw.totalPrice)
      };
    }

    const order = readOrder();

    const details = document.getElementById("orderDetails");
    const payButton = document.getElementById("payButton");
    const message = document.getElementById("paymentMessage");
    const qrSection = document.getElementById("qrSection");
    const submitButton = document.getElementById("submitUTR");

    let paymentSubmitted = false;

    function showMessage(text) {
      message.hidden = false;
      message.textContent = text;
    }

    const validOrder = Boolean(
      order.orderId &&
      order.name &&
      /^[0-9]{10}$/.test(String(order.phone || "")) &&
      order.fileNames.length > 0 &&
      order.filePaths.length === order.fileNames.length &&
      Number.isInteger(order.totalPages) &&
      order.totalPages > 0 &&
      Number.isInteger(order.copies) &&
      order.copies > 0 &&
      Number.isFinite(order.totalPrice) &&
      order.totalPrice > 0 &&
      ["Black & White", "Colour"].includes(order.printType) &&
      ["Single Side", "Double Side"].includes(order.printSide)
    );

    if (!validOrder) {
      details.textContent =
        "Valid order nahi mila ya order data adhura hai. Please order page se dobara order banayein.";

      payButton.disabled = true;

      showMessage(
        "Order details missing hain. Back to Order par tap karke dobara try karein."
      );
    } else {
      [
        ["Order ID", order.orderId],
        ["Name", order.name],
        ["Files", order.fileNames.join(", ")],
        ["Total Pages", order.totalPages],
        ["Print Type", order.printType],
        ["Printing Side", order.printSide],
        ["Copies", order.copies],
        ["Total Amount", "₹" + order.totalPrice.toFixed(2)]
      ].forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "row";

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0];

        const value = document.createElement("span");
        value.className = index === 7 ? "value total" : "value";
        value.textContent = item[1];

        row.append(label, value);
        details.appendChild(row);
      });
    }

    function generateQR() {
      if (!validOrder) return;

      const amount = order.totalPrice.toFixed(2);

      const upiLink = "upi://pay?" + new URLSearchParams({
        pa: UPI_ID,
        pn: UPI_NAME,
        am: amount,
        cu: "INR",
        tn: "Order " + order.orderId
      }).toString();

      document.getElementById("qrImage").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
        encodeURIComponent(upiLink);

      document.getElementById("qrAmount").textContent =
        "Pay exactly ₹" + amount;

      document.getElementById("openUPI").onclick = () => {
        window.location.href = upiLink;
      };

      qrSection.hidden = false;
      payButton.disabled = true;
      payButton.textContent = "QR Generated";
    }

    payButton.addEventListener("click", generateQR);

    // Firebase Auth initialization ka wait
    function waitForAuth() {
      return new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
          unsubscribe();
          resolve(user);
        });
      });
    }

    // UTR ko existing Order mein update karna
    submitButton.addEventListener("click", async () => {
      if (!validOrder || paymentSubmitted) return;

      const utr = document.getElementById("utr").value.trim();

      if (!/^[A-Za-z0-9]{8,30}$/.test(utr)) {
        showMessage(
          "Kripya valid UTR enter karein (8–30 letters/numbers)."
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      try {
        const user = await waitForAuth();

        if (!user) {
          throw new Error(
            "Customer login nahi mila. Isi browser mein order dobara banayein."
          );
        }

        const customerUid = get("customerUid");

        if (!customerUid || user.uid !== customerUid) {
          throw new Error(
            "Customer session match nahi hui. Order dobara banayein."
          );
        }

        const orderRef = doc(db, "orders", order.orderId);

        const orderSnapshot = await getDoc(orderRef);

        if (!orderSnapshot.exists()) {
          throw new Error("Firestore mein Order nahi mila.");
        }

        const savedOrder = orderSnapshot.data();

        if (savedOrder.uid !== user.uid) {
          throw new Error("Is Order ko update karne ki permission nahi hai.");
        }

        if (savedOrder.utr && savedOrder.utr !== "") {
          throw new Error("Is Order ka UTR pehle hi submit ho chuka hai.");
        }

        if (
          savedOrder.paymentStatus !== "PENDING" ||
          savedOrder.orderStatus !== "PENDING"
        ) {
          throw new Error("Order ka current status update ke liye valid nahi hai.");
        }

        // Sirf existing Order ka UTR update hoga.
        await updateDoc(orderRef, {
          utr: utr
        });

        paymentSubmitted = true;

        showMessage(
          "UTR successfully save ho gaya! Payment status abhi bhi PENDING hai. Admin transaction verify karne ke baad hi Paid mark karega."
        );

        submitButton.textContent = "UTR Submitted";

      } catch (error) {
        console.error(error);

        showMessage(
          "UTR save nahi hua: " + (error.message || "Unknown error")
        );

        submitButton.disabled = false;
        submitButton.textContent = "Retry Submit";
      }
    });

    document.getElementById("backButton").addEventListener("click", () => {
      window.location.href = "confirmation.html";
    });

  </script>
</body>
        </html>
