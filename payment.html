<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Smart Printing</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }

    header {
      background: #155eef;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 15px;
    }

    main {
      max-width: 500px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000010;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .label {
      color: #667085;
    }

    .value {
      font-weight: bold;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .total {
      color: #155eef;
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay {
      background: #155eef;
      color: white;
    }

    .back {
      background: #e8efff;
      color: #155eef;
    }

    .note {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    #paymentMessage {
      margin-top: 15px;
      padding: 12px;
      background: #fff4e5;
      border-radius: 8px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>🖨️ Smart Printing</h1>
  <p>Order Payment</p>
</header>

<main>
  <div class="card">
    <h2>💳 Payment Summary</h2>

    <div id="orderDetails">
      Order details load ho rahi hain...
    </div>

    <button class="pay" id="payButton" type="button">
      Pay Now
    </button>

    <button class="back" id="backButton" type="button">
      Back to Order
    </button>

    <div id="paymentMessage" hidden></div>

    <p class="note">
      Note: Yeh demo payment page hai. Koi real payment nahi hoga
      aur order kisi real print shop ko nahi bheja gaya hai.
    </p>
  </div>
</main>

<script>
  const order = JSON.parse(
    sessionStorage.getItem("smartPrintingOrder") || "null"
  );

  const details = document.getElementById("orderDetails");
  const payButton = document.getElementById("payButton");
  const message = document.getElementById("paymentMessage");

  if (!order) {
    details.textContent =
      "Order details nahi mili. Pehle order form bharein.";

    payButton.disabled = true;
  } else {
    const rows = [
      ["Order ID", order.orderId],
      ["Name", order.name],
      ["Total Pages", order.totalPages],
      ["Print Type", order.printType],
      ["Printing Side", order.printSide],
      ["Copies", order.copies],
      ["Total Amount", "₹" + order.totalPrice]
    ];

    rows.forEach(function(item, index) {
      const row = document.createElement("div");
      row.className = "row";

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item[0];

      const value = document.createElement("span");
      value.className =
        index === rows.length - 1 ? "value total" : "value";

      value.textContent = item[1];

      row.append(label, value);
      details.appendChild(row);
    });
  }

  payButton.addEventListener("click", function() {
    if (!order) return;

    message.hidden = false;
    message.textContent =
      "Demo only: Payment abhi available nahi hai. " +
      "Koi paisa nahi kata aur payment confirm nahi hua.";
  });

  document.getElementById("backButton").addEventListener(
    "click",
    function() {
      window.location.href = "confirmation.html";
    }
  );
</script>

</body>
  </html>
