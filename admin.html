<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075bdb">
  <title>Admin Login | Smart Printing</title>

  <style>
    :root {
      --blue: #075bdb;
      --dark: #073b91;
      --light: #eaf3ff;
      --text: #172b4d;
      --muted: #718096;
      --white: #ffffff;
      --border: #dce7f5;
      --danger: #dc3545;
      --success: #128451;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background: linear-gradient(135deg, #eaf3ff, #ffffff, #dceaff);
      overflow-x: hidden;
      position: relative;
    }

    .background-circle {
      position: fixed;
      border-radius: 50%;
      background: linear-gradient(135deg, #0878ff, #8fc5ff);
      opacity: 0.12;
      filter: blur(2px);
      animation: float 9s ease-in-out infinite;
      pointer-events: none;
    }

    .circle-one {
      width: 280px;
      height: 280px;
      top: -90px;
      left: -80px;
    }

    .circle-two {
      width: 350px;
      height: 350px;
      right: -130px;
      bottom: -120px;
      animation-delay: 2s;
    }

    .circle-three {
      width: 100px;
      height: 100px;
      right: 15%;
      top: 12%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-25px) scale(1.06);
      }
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
      animation: appear 0.7s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(18, 73, 145, 0.13);
      backdrop-filter: blur(12px);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 75px;
      height: 75px;
      border-radius: 22px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 34px;
      background: linear-gradient(135deg, #0878ff, #0646ae);
      box-shadow: 0 10px 25px rgba(7, 91, 219, 0.25);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 10px 25px rgba(7, 91, 219, 0.25);
      }
      50% {
        box-shadow: 0 10px 35px rgba(7, 91, 219, 0.45);
      }
    }

    .brand h1 {
      font-size: 25px;
      color: var(--dark);
      margin-bottom: 7px;
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
    }

    .admin-badge {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 13px;
      border-radius: 30px;
      background: var(--light);
      color: var(--blue);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .form-title {
      font-size: 19px;
      margin-bottom: 7px;
      color: var(--text);
    }

    .form-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #344767;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      height: 49px;
      padding: 0 45px 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      color: var(--text);
      background: #fbfdff;
      transition: 0.25s;
    }

    .input-wrapper input:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(7, 91, 219, 0.08);
    }

    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #8da2bd;
      font-size: 17px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--blue);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px;
    }

    .password-input {
      padding-right: 65px !important;
    }

    .login-btn {
      width: 100%;
      height: 51px;
      margin-top: 7px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0878ff, #0646ae);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 20px rgba(7, 91, 219, 0.2);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(7, 91, 219, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #a51e2b;
      background: #fff0f1;
      border: 1px solid #ffd5d9;
    }

    .message.success {
      display: block;
      color: #087747;
      background: #eafaf2;
      border: 1px solid #c9f0dc;
    }

    .security-note {
      margin-top: 23px;
      padding: 13px;
      border-radius: 12px;
      background: #f3f8ff;
      color: #536984;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .footer {
      text-align: center;
      color: #8293aa;
      font-size: 11px;
      margin-top: 22px;
    }

    .footer strong {
      color: var(--blue);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 22px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .background-circle {
        opacity: 0.08;
      }
    }
  </style>
</head>

<body>

  <div class="background-circle circle-one"></div>
  <div class="background-circle circle-two"></div>
  <div class="background-circle circle-three"></div>

  <main class="login-container">

    <section class="login-card">

      <div class="brand">
        <div class="brand-icon">🖨️</div>

        <h1>Smart Printing</h1>

        <p>Printing Kiosk Network</p>

        <span class="admin-badge">SUPER ADMIN PANEL</span>
      </div>

      <h2 class="form-title">Welcome Back!</h2>

      <p class="form-subtitle">
        Sign in to access your Smart Printing administration dashboard.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Admin Email Address</label>

          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              placeholder="Enter admin email"
              autocomplete="username"
              required
            >
            <span class="input-icon">✉️</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="togglePassword"
            >
              Show
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Secure Admin Login →
        </button>

        <div id="message" class="message" role="alert"></div>

      </form>

      <div class="security-note">
        🔒 <strong>Secure Admin Access</strong><br>
        Only the authorised Super Admin account can access this panel.
      </div>

    </section>

    <div class="footer">
      © 2026 <strong>Smart Printing</strong><br>
      Administration Portal
    </div>

  </main>

  <script type="module">

    import {
      auth,
      ADMIN_UID
    } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const messageBox = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");


    let loginInProgress = false;


    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }


    function hideMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }


    function setLoading(loading) {
      loginBtn.disabled = loading;

      loginBtn.textContent = loading
        ? "Verifying Admin Account..."
        : "Secure Admin Login →";
    }


    function isSuperAdmin(user) {
      return Boolean(
        user &&
        ADMIN_UID &&
        user.uid === ADMIN_UID
      );
    }


    // Password visibility
    togglePassword.addEventListener("click", () => {

      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      togglePassword.textContent =
        isPassword ? "Hide" : "Show";

    });


    // Check existing Firebase session
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        return;
      }

      if (isSuperAdmin(user)) {

        window.location.replace("admin-dashboard.html");

      } else {

        // Any non-admin user must not remain in this admin session.
        await signOut(auth);

        showMessage(
          "Access denied. This account is not authorised as Super Admin."
        );

      }

    });


    // Admin Login
    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (loginInProgress) {
        return;
      }

      hideMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        showMessage("Please enter your email and password.");
        return;

      }

      loginInProgress = true;
      setLoading(true);

      try {

        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = credential.user;

        if (!isSuperAdmin(user)) {

          await signOut(auth);

          showMessage(
            "Access denied. Your account does not have Super Admin permission."
          );

          return;

        }

        showMessage(
          "Login successful! Opening dashboard...",
          "success"
        );

        window.location.replace("admin-dashboard.html");

      } catch (error) {

        console.error("Admin login error:", error);

        let errorMessage =
          "Login failed. Please try again.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {

          errorMessage =
            "Incorrect email or password.";

        } else if (
          error.code === "auth/too-many-requests"
        ) {

          errorMessage =
            "Too many attempts. Please try again later.";

        } else if (
          error.code === "auth/network-request-failed"
        ) {

          errorMessage =
            "Network error. Please check your internet connection.";

        } else if (
          error.code === "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email address.";

        }

        showMessage(errorMessage);

      } finally {

        loginInProgress = false;
        setLoading(false);

      }

    });

  </script>

</body>
                                       </html>
