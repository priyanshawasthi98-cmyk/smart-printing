<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Printing - Admin Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #102b55, #174ea6, #3478d4);
}

.container {
  width: 100%;
  max-width: 430px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.2);
}

h1 {
  text-align: center;
  color: #174ea6;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: #174ea6;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.reset {
  background: #16834a;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.success {
  color: green;
}

.error {
  color: red;
}

.hidden {
  display: none !important;
}

.status {
  padding: 12px;
  background: #e8f5e9;
  border-radius: 8px;
  color: #16733a;
  text-align: center;
  margin-top: 15px;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #777;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- ADMIN LOGIN -->

  <div class="card" id="loginBox">

    <h1>🖨️ Smart Printing</h1>

    <div class="subtitle">Admin Secure Login</div>

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login Securely
    </button>

    <button id="resetBtn" class="reset">
      Forgot Password?
    </button>

    <div id="loginMessage" class="message"></div>

    <div class="note">
      Authorized Admin Access Only
    </div>

  </div>


  <!-- ADMIN VERIFIED -->

  <div class="card hidden" id="adminBox">

    <h1>Admin Verified</h1>

    <div class="status">
      🟢 Admin Session Active
    </div>

    <p><b>Admin Email:</b></p>

    <p id="adminEmail"></p>

    <p><b>Admin UID:</b></p>

    <p id="adminUID" style="overflow-wrap:anywhere;"></p>

    <p id="sessionStatus" class="message success">
      Session Active
    </p>

    <button id="dashboardBtn">
      Open Admin Dashboard
    </button>

    <button id="logoutBtn" style="background:#d93025;">
      Logout
    </button>

  </div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// ADMIN UID

const ADMIN_UID = "ibK3XWMUEYQIbBhPmGQRnW72MZg1";


// ELEMENTS

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");
const resetBtn = document.getElementById("resetBtn");
const logoutBtn = document.getElementById("logoutBtn");
const dashboardBtn = document.getElementById("dashboardBtn");

const loginMessage = document.getElementById("loginMessage");


// MESSAGE

function showMessage(text, type = "") {

  loginMessage.textContent = text;
  loginMessage.className = "message " + type;

}


// ERROR HANDLING

function friendlyError(error) {

  const errors = {

    "auth/invalid-email": "Invalid email address.",

    "auth/user-not-found": "Admin account not found.",

    "auth/wrong-password": "Incorrect password.",

    "auth/invalid-credential": "Incorrect email or password.",

    "auth/too-many-requests": "Too many attempts. Try again later.",

    "auth/network-request-failed": "Internet connection failed.",

    "auth/user-disabled": "This account is disabled."

  };

  return errors[error.code] || error.message;

}


// ADMIN LOGIN

loginBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {

    showMessage("Enter email and password.", "error");

    return;

  }

  loginBtn.disabled = true;

  showMessage("Checking admin credentials...");

  try {

    await setPersistence(auth, browserLocalPersistence);

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      showMessage(
        "Access denied. Unauthorized account.",
        "error"
      );

      return;

    }

    showMessage(
      "Admin login successful.",
      "success"
    );

  } catch (error) {

    showMessage(
      friendlyError(error),
      "error"
    );

  } finally {

    loginBtn.disabled = false;

  }

});


// FORGOT PASSWORD

resetBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();

  if (!email) {

    showMessage(
      "Enter your admin email first.",
      "error"
    );

    return;

  }

  resetBtn.disabled = true;

  showMessage("Sending password reset email...");

  try {

    await sendPasswordResetEmail(auth, email);

    showMessage(
      "Password reset email sent. Check your inbox.",
      "success"
    );

  } catch (error) {

    showMessage(
      friendlyError(error),
      "error"
    );

  } finally {

    resetBtn.disabled = false;

  }

});


// AUTH SESSION MONITOR

onAuthStateChanged(auth, async (user) => {

  if (user && user.uid === ADMIN_UID) {

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    document.getElementById("adminEmail").textContent =
      user.email || "Admin";

    document.getElementById("adminUID").textContent =
      user.uid;

    document.getElementById("sessionStatus").textContent =
      "Session Active";

  } else {

    loginBox.classList.remove("hidden");

    adminBox.classList.add("hidden");

    if (user && user.uid !== ADMIN_UID) {

      await signOut(auth);

    }

  }

});


// OPEN ADMIN DASHBOARD

dashboardBtn.addEventListener("click", () => {

  window.location.href = "admin-dashboard.html";

});


// LOGOUT

logoutBtn.addEventListener("click", async () => {

  logoutBtn.disabled = true;

  try {

    await signOut(auth);

    showMessage("Logged out successfully.", "success");

  } catch (error) {

    alert("Logout failed: " + friendlyError(error));

  } finally {

    logoutBtn.disabled = false;

  }

});

</script>

</body>
      </html>
